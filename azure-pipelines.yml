trigger:
- main

variables:
- group: New variable group 26-Feb   # DEPLOY_USER + DEPLOY_PASSWORD

- name: buildConfiguration
  value: 'Release'

- name: publishFolder
  value: '$(Build.ArtifactStagingDirectory)\publish'

- name: zipFile
  value: '$(Build.ArtifactStagingDirectory)\package.zip'

- name: iisSite
  value: 'blocker-1.deltanium.com'

- name: webProject
  value: 'deltanium-blocker.csproj'

stages:

- stage: Build
  displayName: Build
  jobs:
  - job: BuildJob
    pool:
      vmImage: 'windows-latest'
    steps:
    - checkout: self

    - task: UseDotNet@2
      displayName: Install .NET 8 SDK
      inputs:
        packageType: sdk
        version: 8.x

    - powershell: |
        if (Test-Path "$(publishFolder)") {
            Remove-Item "$(publishFolder)" -Recurse -Force
        }
      displayName: Clean publish folder

    - task: DotNetCoreCLI@2
      displayName: Restore
      inputs:
        command: restore
        projects: '$(webProject)'

    - task: DotNetCoreCLI@2
      displayName: Publish
      inputs:
        command: publish
        projects: '$(webProject)'
        arguments: '--configuration $(buildConfiguration) --output "$(publishFolder)"'
        zipAfterPublish: false
        modifyOutputPath: false

    - powershell: |
        Write-Host "===== PUBLISH FOLDER STRUCTURE ====="
        Get-ChildItem "$(publishFolder)"
      displayName: Verify publish output

    - task: ArchiveFiles@2
      displayName: Create package.zip
      inputs:
        rootFolderOrFile: '$(publishFolder)'
        includeRootFolder: false
        archiveType: zip
        archiveFile: '$(zipFile)'
        replaceExistingArchive: true

    - publish: $(zipFile)
      artifact: drop

- stage: Deploy
  displayName: Deploy to IIS (blocker-1.deltanium.com)
  dependsOn: Build
  jobs:
  - job: DeployJob
    pool:
      vmImage: 'windows-latest'
    steps:
    - download: current
      artifact: drop

    - task: PowerShell@2
      displayName: Deploy via MSDeploy
      inputs:
        targetType: inline
        script: |
          $ErrorActionPreference = "Stop"
          $msdeploy = "C:\Program Files\IIS\Microsoft Web Deploy V3\msdeploy.exe"

          Write-Host "Deploying Block Creator → $(iisSite)"

          $arguments = @(
            "-verb:sync",
            "-source:package=$(Pipeline.Workspace)\drop\package.zip",
            "-dest:contentPath=$(iisSite),computerName=https://103.179.190.130:8172/msdeploy.axd?site=$(iisSite),userName=$(DEPLOY_USER),password=$(DEPLOY_PASSWORD),authType=Basic",
            "-enableRule:AppOffline",
            "-allowUntrusted"
          )

          & $msdeploy $arguments
          if ($LASTEXITCODE -ne 0) {
              throw "MSDeploy failed with exit code $LASTEXITCODE"
          }

          Write-Host "Deployment completed successfully!"
